<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Jogo do Mundo</title>
<meta name="description" content="Explorador do mundo real em 3D: relevo, satélite, casas, clima ao vivo, voo, caminhada e nado.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700;1,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#0b0d12;color:#f4f1ea;font-family:system-ui,sans-serif;overflow:hidden}#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}#boot0{position:fixed;inset:0;display:grid;place-items:center;font-size:14px;opacity:.7}</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js" } }
</script>
</head>
<body>
<!-- Esta página é só uma casca: a interface e o estilo são montados pelo próprio jogo (game.js),
     para que uma cópia antiga desta página guardada no aparelho continue funcionando com o jogo novo. -->
<canvas id="c"></canvas>
<div id="boot0">Carregando o jogo…</div>
<script type="module">
import*as St from"three";var Gi=`<div id="hud" class="hidden">
  <div id="labels"></div>
  <div id="reticle"></div>
  <div id="compass"><div id="compass-strip"></div><div id="compass-mark"></div></div>
  <div id="goal"></div>
  <div id="wp"><i></i><span></span></div>
  <canvas id="minimap" title="Abrir mapa"></canvas>
  <div id="obj"></div>
  <button id="act" class="hidden"></button>
  <div id="hint"></div>
  <div id="toast"></div>
  <div id="loc">
    <div id="loc-name">\u2014</div>
    <div id="loc-sub"></div>
    <div id="loc-coord"></div>
    <div id="loc-wx"></div>
  </div>
  <div id="spd">
    <div id="spd-alt"></div>
    <div id="spd-row"><span id="spd-num">0</span><span id="spd-unit">km/h</span></div>
    <div id="spd-mach"></div>
    <div id="spd-boost"></div>
  </div>
  <div id="loading"></div>
  <div id="topbar">
    <button id="btn-photo" class="ib" title="Tirar foto (P)" aria-label="Tirar foto"><svg viewBox="0 0 24 24"><path d="M4 7h3l2-2h6l2 2h3v12H4z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <button id="btn-cam" class="ib" title="Trocar c\xE2mera (C)" aria-label="Trocar c\xE2mera"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <button id="btn-menu" class="ib" title="Menu (M)" aria-label="Abrir menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </div>
  <div id="touch" class="hidden">
    <div id="stick"><div id="stick-knob"></div></div>
    <div id="tbtns">
      <button id="t-level" class="tb sm">BOOST 2</button>
      <button id="t-x" class="tb sm">PLANAR</button>
      <button id="t-fly" class="tb">POUSAR</button>
      <button id="t-a" class="tb">FREIO</button>
      <button id="t-boost" class="tb big">TURBO</button>
    </div>
  </div>
</div>

<div id="flash"></div>
<div id="start">
  <div class="start-inner">
    <div class="brand"><span class="dot"></span>SIMULADOR DA TERRA</div>
    <h1>Jogo do <em>Mundo</em></h1>
    <p class="lead">Voe por qualquer lugar do planeta com relevo real, imagens de sat\xE9lite, clima ao vivo, esta\xE7\xF5es do ano e hora do dia. Acelere at\xE9 passar a barreira do som ou suba at\xE9 a \xF3rbita.</p>
    <div class="search">
      <input id="start-q" type="search" placeholder="Buscar um lugar (ex.: Chamonix, P\xE3o de A\xE7\xFAcar, Monte Fuji)" autocomplete="off">
      <button id="start-go">Buscar</button>
    </div>
    <div id="start-results" class="results"></div>
    <div class="label">Lugares em destaque</div>
    <div id="places" class="places"></div>
    <div class="start-foot">
      <button id="start-geo" class="ghost">\u{1F4CD} Minha localiza\xE7\xE3o</button>
      <span class="credits">Relevo: Terrain Tiles (AWS/Mapzen) \xB7 Clima: Open-Meteo \xB7 Lugares, casas e \xE1gua: \xA9 OpenStreetMap (OpenFreeMap) \xB7 <span id="cred-img"></span></span>
    </div>
  </div>
  <div id="boot">Carregando motor 3D\u2026</div>
</div>

<div id="menu" class="hidden">
  <div class="menu-panel">
    <div class="menu-head">
      <div class="tabs">
        <button data-tab="lugares" class="on">Lugares</button>
        <button data-tab="mapa">Mapa</button>
        <button data-tab="desafios">Desafios</button>
        <button data-tab="personagem">Personagem</button>
        <button data-tab="ajustes">Ajustes</button>
        <button data-tab="controles">Controles</button>
      </div>
      <button id="menu-close" class="ib" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="tab" id="tab-lugares">
      <div class="search">
        <input id="menu-q" type="search" placeholder="Buscar qualquer lugar do mundo" autocomplete="off">
        <button id="menu-go">Buscar</button>
      </div>
      <div id="menu-results" class="results"></div>
      <div class="label">Meus favoritos</div>
      <button id="fav-add" class="ghost">\u2605 Salvar o lugar onde estou</button>
      <div id="fav-list" class="results"></div>
      <div class="label">Lugares em destaque</div>
      <div id="menu-places" class="places"></div>
    </div>
    <div class="tab hidden" id="tab-mapa">
      <div id="wmap-wrap">
        <canvas id="wmap"></canvas>
        <div id="wmap-zoom"><button id="wmap-in" class="ib">+</button><button id="wmap-out" class="ib">\u2212</button><button id="wmap-me" class="ib" title="Centralizar em mim">\u25CE</button></div>
      </div>
      <div id="wmap-info" class="note">Arraste para mover, use dois dedos ou a roda do mouse para aproximar. Toque num ponto para escolher um destino.</div>
      <div id="wmap-act" class="hidden">
        <button id="wmap-go" class="act">Voar para c\xE1 agora</button>
        <button id="wmap-dest" class="ghost">Marcar como destino</button>
      </div>
    </div>
    <div class="tab hidden" id="tab-desafios">
      <div class="label" style="margin-top:4px">Desafios</div>
      <div class="chal">
        <button id="ch-rings" class="place"><span class="tag">TEMPO</span><b>Percurso de an\xE9is</b><small>12 an\xE9is \xE0 sua frente, acompanhando o relevo. Passe por todos no menor tempo.</small></button>
        <button id="ch-stop" class="place hidden"><span class="tag">ATIVO</span><b>Encerrar desafio</b><small>Cancela o desafio ou o destino atual.</small></button>
      </div>
      <div class="label">Corrida at\xE9 uma cidade</div>
      <div id="ch-races" class="results"></div>
      <div class="label">Objetivos do cen\xE1rio</div>
      <div id="ch-obj" class="stats"></div>
      <p class="note">Losangos laranja marcam objetivos em casas, troncos de \xE1rvores, postes, bancos, placas, pedras e muros. Chegue perto a p\xE9 e use <kbd>E</kbd> (ou toque no bot\xE3o) para concluir; os conclu\xEDdos ficam verdes e salvos.</p>
      <div class="label">Recordes</div>
      <div id="ch-stats" class="stats"></div>
      <div class="label">Monumentos descobertos <span id="ch-found-n"></span></div>
      <div id="ch-found" class="found"></div>
    </div>
    <div class="tab hidden" id="tab-personagem">
      <div class="row"><label>Cor do traje</label><div class="ctl sw" id="sw-suit" data-key="suit" data-opts="#1c3f9e,#b3202a,#1b1d24,#1f7a4a,#5b2a9e,#d9dde3,#d9a514,#0f8f9e"></div></div>
      <div class="row"><label>Detalhes e luzes</label><div class="ctl sw" id="sw-acc" data-key="acc" data-opts="#ff6a1a,#19d3ff,#9dff2a,#ff3d9a,#ffffff,#ffd21a,#ff2a2a"></div></div>
      <div class="row"><label>Asas do wingsuit</label><div class="ctl sw" id="sw-helmet" data-key="helmet" data-opts="#eeeeee,#20232b,#c9a227,#b3202a,#1c3f9e"></div></div>
      <div class="row"><label>Rastro de vapor</label><div class="ctl sw" id="sw-trail" data-key="trail" data-opts="#ffffff,#ff6a1a,#19d3ff,#ff3d9a,#9dff2a,#ffd21a"></div></div>
      <p class="note">As cores mudam na hora \u2014 feche o menu para ver o personagem.</p>
    </div>
    <div class="tab hidden" id="tab-ajustes">
      <div class="row"><label>Hora do dia</label>
        <div class="ctl"><label class="chk"><input type="checkbox" id="set-now" checked> Agora (hora real local)</label>
        <input type="range" id="set-hour" min="0" max="24" step="0.25" value="12"><span id="set-hour-v" class="val">12:00</span></div></div>
      <div class="row"><label>Passagem do tempo</label><div class="ctl seg" id="set-ts" data-opts="1:Real,60:60\xD7,600:600\xD7"></div></div>
      <div class="row"><label>Esta\xE7\xE3o do ano</label><div class="ctl seg" id="set-season" data-opts="auto:Auto,spring:Primavera,summer:Ver\xE3o,autumn:Outono,winter:Inverno"></div></div>
      <div class="row"><label>Clima</label><div class="ctl seg" id="set-weather" data-opts="live:Ao vivo,clear:Limpo,cloudy:Nublado,rain:Chuva,snow:Neve,storm:Tempestade,fog:Neblina"></div></div>
      <div class="row"><label>Qualidade gr\xE1fica</label><div class="ctl seg" id="set-quality" data-opts="auto:Autom\xE1tica,baixa:Baixa,media:M\xE9dia,alta:Alta"></div></div>
      <div class="row"><label>Imagens de sat\xE9lite</label><div class="ctl seg" id="set-img" data-opts="esri:Esri (detalhada),s2:Sentinel-2"></div></div>
      <div class="row"><label>Op\xE7\xF5es</label><div class="ctl">
        <label class="chk"><input type="checkbox" id="set-bld" checked> Casas, pr\xE9dios, lagos e rios 3D</label>
        <label class="chk"><input type="checkbox" id="set-lbl" checked> Nomes de bairros, cidades e picos</label>
        <label class="chk"><input type="checkbox" id="set-snd" checked> Som</label>
        <label class="chk"><input type="checkbox" id="set-inv"> Inverter eixo vertical</label>
        <label class="chk"><input type="checkbox" id="set-blur" checked> Desfoque de velocidade</label>
      </div></div>
      <div class="row"><label>Sensibilidade</label><div class="ctl"><input type="range" id="set-sens" min="0.3" max="2.5" step="0.1" value="1"></div></div>
    </div>
    <div class="tab hidden" id="tab-controles">
      <div class="keys">
        <div><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd><span>Mover na dire\xE7\xE3o da c\xE2mera (andar, nadar, voar)</span></div>
        <div>mouse / <kbd>\u2190</kbd> <kbd>\u2192</kbd> <kbd>\u2191</kbd> <kbd>\u2193</kbd><span>Girar a vis\xE3o (clique na tela para usar o mouse). Voando, voc\xEA vai para onde olha</span></div>
        <div><kbd>Shift</kbd><span>Turbo no ar \xB7 correr no ch\xE3o \xB7 nadar r\xE1pido</span></div>
        <div><kbd>1</kbd>\u2013<kbd>6</kbd><span>Escolher o boost: Passeio, R\xE1pido, Supers\xF4nico, Hipers\xF4nico, Orbital, M\xE1ximo</span></div>
        <div><kbd>F</kbd><span>Decolar / pousar</span></div>
        <div><kbd>Espa\xE7o</kbd><span>Pular (no ch\xE3o) \xB7 subir (pairando). <kbd>Q</kbd> desce</span></div>
        <div><kbd>X</kbd><span>Planar de wingsuit</span></div>
        <div><kbd>E</kbd><span>Interagir com um objetivo (losango laranja)</span></div>
        <div><kbd>G</kbd><span>Acenar</span></div>
        <div><kbd>C</kbd><span>Trocar c\xE2mera</span></div>
        <div><kbd>P</kbd><span>Tirar foto</span></div>
        <div><kbd>R</kbd><span>Come\xE7ar percurso de an\xE9is</span></div>
        <div><kbd>M</kbd> / <kbd>Esc</kbd><span>Menu</span> \xB7 <kbd>T</kbd><span>Avan\xE7ar 1 hora</span></div>
      </div>
      <p class="note">No celular: o <b>anal\xF3gico</b> (lado esquerdo) escolhe a dire\xE7\xE3o; <b>arrastar o lado direito</b> gira a vis\xE3o \u2014 voando, voc\xEA vai para onde olha. Segure <b>TURBO</b> para acelerar at\xE9 a velocidade do <b>BOOST</b> escolhido (toque nele para trocar), <b>POUSAR</b> desce at\xE9 o ch\xE3o, <b>PLANAR</b> abre o wingsuit. No ch\xE3o, <b>CORRER</b> e <b>PULAR</b>; na \xE1gua o personagem nada sozinho.</p>
      <p class="note">Fontes: relevo Terrain Tiles (Mapzen/AWS) \xB7 <span id="cred-img2"></span> \xB7 luzes noturnas NASA Black Marble \xB7 clima Open-Meteo \xB7 nomes, casas, lagos e rios \xA9 colaboradores do OpenStreetMap (OpenFreeMap).</p>
    </div>
  </div>
</div>
`;var Fi=`:root {
  --ink: #f4f1ea;
  --dim: rgba(244, 241, 234, 0.62);
  --acc: #ff6a1a;
  --panel: rgba(14, 16, 22, 0.86);
  --line: rgba(255, 255, 255, 0.12);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; color: var(--ink); font-family: Inter, system-ui, sans-serif; overscroll-behavior: none; }
canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
.hidden { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; user-select: none; -webkit-user-select: none; }
#reticle { position: absolute; left: 50%; top: 52%; width: 18px; height: 18px; margin: -9px; border: 1.5px solid rgba(255,255,255,.75); border-radius: 50%; box-shadow: 0 0 6px rgba(0,0,0,.4); }
#loc { position: absolute; left: calc(18px + var(--sal)); bottom: calc(16px + var(--sab)); text-shadow: 0 1px 6px rgba(0,0,0,.65); max-width: 46vw; }
#loc-name { font: 700 22px/1 'Barlow Condensed', sans-serif; letter-spacing: .06em; text-transform: uppercase; }
#loc-sub, #loc-coord, #loc-wx { font-size: 11.5px; color: var(--dim); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#loc-wx { color: var(--ink); opacity: .85; }
#spd { position: absolute; right: calc(20px + var(--sar)); bottom: calc(12px + var(--sab)); text-align: right; text-shadow: 0 2px 10px rgba(0,0,0,.55); }
#spd-alt { font: 600 13px/1 'Barlow Condensed', sans-serif; letter-spacing: .08em; color: var(--dim); }
#spd-row { display: flex; align-items: baseline; justify-content: flex-end; gap: 6px; }
#spd-num { font: italic 800 64px/0.95 'Barlow Condensed', sans-serif; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
#spd-unit { font: 600 14px 'Barlow Condensed', sans-serif; color: var(--dim); }
#spd-mach { font: 700 14px/1 'Barlow Condensed', sans-serif; letter-spacing: .12em; color: var(--dim); min-height: 14px; }
#spd-mach.super { color: var(--acc); }
#hint { position: absolute; left: 50%; bottom: calc(22px + var(--sab)); transform: translateX(-50%); background: rgba(10,12,18,.62); border: 1px solid var(--line); padding: 6px 12px; border-radius: 6px; font-size: 12px; white-space: nowrap; opacity: 0; transition: opacity .4s; backdrop-filter: blur(4px); }
#hint.show { opacity: 1; }
#toast { position: absolute; left: 50%; top: calc(64px + var(--sat)); transform: translateX(-50%); font: 700 18px 'Barlow Condensed', sans-serif; letter-spacing: .12em; text-transform: uppercase; opacity: 0; transition: opacity .3s; text-shadow: 0 2px 10px rgba(0,0,0,.6); white-space: nowrap; }
#toast.show { opacity: 1; }
#compass { position: absolute; left: 50%; top: calc(14px + var(--sat)); width: min(340px, 50vw); height: 22px; transform: translateX(-50%); overflow: hidden; mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); }
#compass-strip { position: absolute; top: 0; left: 50%; height: 100%; white-space: nowrap; font: 600 12px/22px 'Barlow Condensed', sans-serif; letter-spacing: .1em; color: rgba(255,255,255,.85); text-shadow: 0 1px 4px rgba(0,0,0,.6); }
#compass-strip span { display: inline-block; width: 30px; text-align: center; }
#compass-strip span.c { color: var(--acc); font-weight: 700; }
#compass-mark { position: absolute; left: 50%; bottom: 0; width: 2px; height: 5px; margin-left: -1px; background: var(--acc); }
#loading { position: absolute; left: calc(18px + var(--sal)); top: calc(16px + var(--sat)); font-size: 11px; color: var(--dim); text-shadow: 0 1px 4px rgba(0,0,0,.6); }
#topbar { position: absolute; right: calc(12px + var(--sar)); top: calc(10px + var(--sat)); display: flex; gap: 8px; pointer-events: auto; }
.ib { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: rgba(10,12,18,.55); display: grid; place-items: center; padding: 0; backdrop-filter: blur(6px); }
.ib svg { width: 20px; height: 20px; }
.ib:hover { background: rgba(30,34,44,.8); }

/* ---------- toque ---------- */
#touch { position: absolute; inset: 0; pointer-events: none; }
#stick { position: absolute; width: 120px; height: 120px; margin: -60px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.25); background: rgba(255,255,255,.05); opacity: 0; transition: opacity .2s; }
#stick.on { opacity: 1; }
#stick-knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px; border-radius: 50%; background: rgba(255,255,255,.35); }
#tbtns { position: absolute; right: calc(14px + var(--sar)); bottom: calc(118px + var(--sab)); display: grid; grid-template-columns: auto auto; gap: 10px; pointer-events: auto; align-items: end; }
.tb { width: 66px; height: 66px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.3); background: rgba(10,12,18,.45); font: 700 12px 'Barlow Condensed', sans-serif; letter-spacing: .08em; touch-action: none; backdrop-filter: blur(4px); }
.tb.big { width: 84px; height: 84px; font-size: 15px; border-color: rgba(255,106,26,.7); background: rgba(255,106,26,.22); grid-column: 2; grid-row: 1 / span 2; }
#t-fly { grid-column: 1; grid-row: 1; }
#t-brake { grid-column: 1; grid-row: 2; }
.tb.down { background: rgba(255,255,255,.3); }
.tb.big.down { background: rgba(255,106,26,.6); }

/* ---------- tela inicial ---------- */
#start { position: fixed; inset: 0; overflow-y: auto; background: radial-gradient(120% 90% at 70% 10%, rgba(255,106,26,.10), transparent 60%), linear-gradient(180deg, rgba(8,10,14,.82), rgba(8,10,14,.96)); z-index: 5; padding: calc(24px + var(--sat)) 16px calc(24px + var(--sab)); }
.start-inner { max-width: 860px; margin: 0 auto; }
.brand { display: inline-flex; align-items: center; gap: 8px; font: 500 11px 'Inter'; letter-spacing: .22em; color: var(--acc); }
.brand .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--acc); }
h1 { font: 600 clamp(40px, 8vw, 72px)/1 'Barlow Condensed', sans-serif; margin: 10px 0 10px; letter-spacing: .01em; }
h1 em { color: var(--acc); font-style: italic; font-weight: 700; }
.lead { color: var(--dim); max-width: 620px; line-height: 1.5; margin: 0 0 18px; font-size: 15px; }
.search { display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; background: rgba(255,255,255,.07); border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 12px 14px; font: inherit; font-size: 15px; outline: none; }
.search input:focus { border-color: rgba(255,106,26,.6); }
.search button, .ghost { background: var(--acc); border: 0; border-radius: 10px; padding: 0 18px; font-weight: 600; color: #160a03; }
.ghost { background: rgba(255,255,255,.08); color: var(--ink); border: 1px solid var(--line); padding: 10px 14px; }
.results { margin: 8px 0 0; display: flex; flex-direction: column; gap: 4px; }
.results button { text-align: left; background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font-size: 13px; color: var(--ink); }
.results button:hover { border-color: rgba(255,106,26,.6); }
.label { margin: 22px 0 10px; font-size: 11px; letter-spacing: .2em; color: var(--dim); text-transform: uppercase; }
.places { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.place { position: relative; text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-height: 92px; overflow: hidden; background: rgba(255,255,255,.04); transition: transform .15s, border-color .15s; }
.place:hover { transform: translateY(-2px); border-color: rgba(255,106,26,.6); }
.place b { display: block; font: 700 19px/1.05 'Barlow Condensed', sans-serif; letter-spacing: .03em; text-transform: uppercase; }
.place small { display: block; margin-top: 5px; color: var(--dim); font-size: 12px; line-height: 1.35; }
.place .tag { position: absolute; right: 10px; top: 10px; font-size: 10px; letter-spacing: .12em; color: var(--acc); }
.start-foot { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 20px; }
.credits { font-size: 11px; color: rgba(244,241,234,.45); line-height: 1.5; }
#boot { position: fixed; left: 50%; bottom: calc(14px + var(--sab)); transform: translateX(-50%); font-size: 12px; color: var(--dim); }

/* ---------- menu ---------- */
#menu { position: fixed; inset: 0; z-index: 6; background: rgba(4,5,8,.45); display: grid; place-items: center; padding: 16px; }
.menu-panel { width: min(720px, 100%); max-height: min(86vh, 760px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px 18px; backdrop-filter: blur(12px); }
.menu-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; position: sticky; top: -14px; background: inherit; padding-top: 2px; z-index: 1; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { background: none; border: 1px solid transparent; border-radius: 8px; padding: 8px 12px; color: var(--dim); font-weight: 600; }
.tabs button.on { color: var(--ink); border-color: var(--line); background: rgba(255,255,255,.06); }
.row { display: grid; grid-template-columns: 160px 1fr; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); align-items: center; }
.row > label { font-size: 13px; color: var(--dim); }
.ctl { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; }
.ctl input[type=range] { flex: 1; min-width: 140px; accent-color: var(--acc); }
.val { font: 600 15px 'Barlow Condensed', sans-serif; min-width: 44px; }
.chk { display: inline-flex; gap: 6px; align-items: center; }
.chk input { accent-color: var(--acc); }
.seg { gap: 4px; }
.seg button { border: 1px solid var(--line); background: rgba(255,255,255,.04); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; }
.seg button.on { background: var(--acc); color: #160a03; border-color: var(--acc); font-weight: 600; }
.keys { display: grid; gap: 8px; font-size: 13px; }
.keys div { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.keys span { color: var(--dim); margin-left: 6px; }
kbd { font: 600 12px Inter; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 2px 7px; background: rgba(255,255,255,.06); }
.note { font-size: 12.5px; color: var(--dim); line-height: 1.5; }

@media (max-width: 720px), (max-height: 500px) {
  #loc-name { font-size: 17px; }
  #loc-sub, #loc-coord, #loc-wx { font-size: 10px; }
  #spd-num { font-size: 46px; }
  #spd { bottom: calc(8px + var(--sab)); }
  #hint { bottom: auto; top: calc(44px + var(--sat)); font-size: 11px; }
  .row { grid-template-columns: 1fr; gap: 6px; }
  #compass { width: 40vw; }
}
@media (pointer: coarse) {
  #reticle { top: 50%; }
}

/* ---------- nomes de lugares no cen\xE1rio ---------- */
#labels { position: absolute; inset: 0; overflow: hidden; }
.wl { position: absolute; left: 0; top: 0; white-space: nowrap; font: 600 12px/1.1 'Barlow Condensed', sans-serif; letter-spacing: .09em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 8px rgba(0,0,0,.6); padding-bottom: 14px; will-change: transform; transition: opacity .3s; }
.wl::after { content: ''; position: absolute; left: 50%; bottom: 0; width: 1px; height: 11px; background: rgba(255,255,255,.7); }
.wl-city { font-size: 17px; font-weight: 700; }
.wl-town { font-size: 14px; font-weight: 700; }
.wl-peak { color: #ffd9c2; }
.wl-lake { color: #bfe3ff; font-style: italic; }
.wl-neighbourhood, .wl-hamlet, .wl-isolated_dwelling, .wl-quarter { font-size: 11px; opacity: .85; }

/* ---------- minimapa, objetivo e ponteiro ---------- */
#minimap { position: absolute; left: calc(14px + var(--sal)); top: calc(38px + var(--sat)); width: 128px; height: 128px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.55); box-shadow: 0 2px 14px rgba(0,0,0,.45); pointer-events: auto; cursor: pointer; background: #10141b; }
#goal { position: absolute; left: 50%; top: calc(42px + var(--sat)); transform: translateX(-50%); font: 700 15px 'Barlow Condensed', sans-serif; letter-spacing: .1em; background: rgba(10,12,18,.6); border: 1px solid rgba(255,106,26,.55); border-radius: 6px; padding: 5px 12px; white-space: nowrap; display: none; backdrop-filter: blur(4px); }
#goal.show { display: block; }
#toast { top: calc(84px + var(--sat)); }
#wp { position: absolute; left: 0; top: 0; display: none; pointer-events: none; text-align: center; }
#wp i { display: block; width: 0; height: 0; margin: 0 auto; border-left: 9px solid transparent; border-right: 9px solid transparent; border-bottom: 16px solid var(--acc); filter: drop-shadow(0 1px 3px rgba(0,0,0,.7)); }
#wp.on i { border: 2px solid var(--acc); width: 22px; height: 22px; transform: rotate(45deg) !important; border-radius: 3px; }
#wp span { display: block; margin-top: 5px; font: 700 12px 'Barlow Condensed', sans-serif; letter-spacing: .08em; text-shadow: 0 1px 4px rgba(0,0,0,.9); }
#flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 9; transition: opacity .35s; }
/* ---------- mapa-m\xFAndi ---------- */
#wmap-wrap { position: relative; height: min(52vh, 440px); border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
#wmap { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#wmap-zoom { position: absolute; right: 8px; top: 8px; display: grid; gap: 6px; }

#wmap-act { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.act { background: var(--acc); border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; color: #160a03; }
/* ---------- desafios e personagem ---------- */
.chal { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.stats div { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: rgba(255,255,255,.04); }
.stats b { display: block; font: 700 21px 'Barlow Condensed', sans-serif; }
.stats small { color: var(--dim); font-size: 11.5px; }
.found { display: flex; flex-wrap: wrap; gap: 6px; }
.found button { border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 12px; color: var(--dim); background: none; }
.found button.ok { color: #160a03; background: #ffd21a; border-color: #ffd21a; font-weight: 600; }
.sw button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); padding: 0; }
.sw button.on { border-color: #fff; box-shadow: 0 0 0 2px var(--acc); }
.fav-row { display: flex; gap: 6px; }
.fav-row button:first-child { flex: 1; }
.fav-row .del { flex: none; width: 40px; text-align: center; color: var(--dim); }
@media (max-width: 720px), (max-height: 500px) {
  #minimap { width: 92px; height: 92px; top: calc(30px + var(--sat)); }
  #goal { font-size: 12px; top: calc(40px + var(--sat)); }

  #wmap-wrap { height: 58vh; }
}

#t-level { border-color: rgba(255,106,26,.7); color: #ffd9c2; }
#spd-boost { font: 600 12px/1.3 'Barlow Condensed', sans-serif; letter-spacing: .12em; color: var(--dim); }
@media (max-height: 420px) { .tb { width: 58px; height: 58px; } .tb.big { width: 76px; height: 76px; } .tb.sm { width: 54px; height: 38px; } #tbtns { bottom: calc(104px + var(--sab)); } }

#obj { position: absolute; left: calc(14px + var(--sal)); top: calc(176px + var(--sat)); font: 600 12px 'Barlow Condensed', sans-serif; letter-spacing: .08em; color: #ffd9c2; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
#act { position: absolute; left: 50%; bottom: calc(64px + var(--sab)); transform: translateX(-50%); pointer-events: auto; background: var(--acc); color: #160a03; border: 0; border-radius: 999px; padding: 11px 20px; font: 700 15px 'Barlow Condensed', sans-serif; letter-spacing: .08em; box-shadow: 0 4px 18px rgba(0,0,0,.45); white-space: nowrap; }

@media (max-width: 720px), (max-height: 500px) { #obj { top: calc(128px + var(--sat)); font-size: 11px; } #act { bottom: calc(18px + var(--sab)); font-size: 13px; padding: 9px 16px; } }

#define HR 8000.0
#define HM 1200.0
#define SUNK 2.2

uniform vec3 uSunDir;
uniform float uSunI;
uniform float uHaze;      // multiplicador de aeross\xF3is (neblina/chuva)
uniform vec3 uAmbient;    // radi\xE2ncia m\xE9dia do c\xE9u (luz ambiente)
uniform float uOvercast;  // 0..1 c\xE9u encoberto (abaixo das nuvens)
uniform float uCamAlt;
float phaseR(float mu){ return 0.0596831*(1.0+mu*mu); }

vec3 sunTransmit(float h, float mu){
